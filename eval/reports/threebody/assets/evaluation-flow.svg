<a href="../FINAL_EVALUATION.html#scope" aria-label="第一册《三体》：36章 → 865个文本块：点击查看详情">
<rect x="20" y="20" width="1060" height="82" rx="12" fill="white" stroke="#203d65" stroke-width="2"/>
<text x="40" y="50" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#203d65">第一册《三体》：36章 → 865个文本块 ↗</text>
<text x="40" y="76" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334155">只评第一册；EPUB文件内的另两册未做效果评测。</text>
</a>
<a href="../FINAL_EVALUATION.html#development" aria-label="24道开发题：用于比较方案：点击查看详情">
<rect x="20" y="142" width="510" height="82" rx="12" fill="white" stroke="#1d6187" stroke-width="2"/>
<text x="40" y="172" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#1d6187">24道开发题：用于比较方案 ↗</text>
<text x="40" y="198" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334155">22道有答案 + 2道无答案；点击展开全部题目。</text>
</a>
<a href="../FINAL_EVALUATION.html#holdout" aria-label="16道保留题：用于最后检验：点击查看详情">
<rect x="570" y="142" width="510" height="82" rx="12" fill="white" stroke="#276956" stroke-width="2"/>
<text x="590" y="172" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#276956">16道保留题：用于最后检验 ↗</text>
<text x="590" y="198" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334155">14道有答案 + 2道无答案；开发时不用于选方案。</text>
</a>
<a href="../FINAL_EVALUATION.html#retrieval" aria-label="实验一：4组检索条件：点击查看详情">
<rect x="20" y="266" width="510" height="100" rx="12" fill="white" stroke="#1d6187" stroke-width="2"/>
<text x="40" y="296" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#1d6187">实验一：4组检索条件 ↗</text>
<text x="40" y="322" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334155">向量 / 混合 × 不扩充 / 补相邻原文</text>
<text x="40" y="347" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334155">每组都是：先取20块 → 精排留5块。</text>
</a>
<a href="../FINAL_EVALUATION.html#controls" aria-label="12个裁判检查样例（辅助）：点击查看详情">
<rect x="570" y="266" width="510" height="82" rx="12" fill="white" stroke="#775524" stroke-width="2"/>
<text x="590" y="296" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#775524">12个裁判检查样例（辅助） ↗</text>
<text x="590" y="322" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334155">检查评分是否合理，不计入40道正式题。</text>
</a>
<a href="../FINAL_EVALUATION.html#generation" aria-label="实验二：2组输入，各生成24份回答：点击查看详情">
<rect x="20" y="408" width="510" height="100" rx="12" fill="white" stroke="#1d6187" stroke-width="2"/>
<text x="40" y="438" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#1d6187">实验二：2组输入，各生成24份回答 ↗</text>
<text x="40" y="464" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334155">同一DeepSeek模型：混合不扩充 vs 混合扩充</text>
<text x="40" y="489" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334155">正确性、依据、行为、语言分别评分。</text>
</a>
<a href="../FINAL_EVALUATION.html#term-splits" aria-label="保留题等待配置固定：点击查看详情">
<rect x="570" y="408" width="510" height="100" rx="12" fill="white" stroke="#276956" stroke-width="2"/>
<text x="590" y="438" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#276956">保留题等待配置固定 ↗</text>
<text x="590" y="464" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334155">开发阶段不运行保留题；不用于选择方案。</text>
<text x="590" y="489" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334155">题目分组与原始内容见附录。</text>
</a>
<a href="../FINAL_EVALUATION.html#parameters" aria-label="选定并固定配置：点击查看详情">
<rect x="20" y="552" width="510" height="82" rx="12" fill="white" stroke="#203d65" stroke-width="2"/>
<text x="40" y="582" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#203d65">选定并固定配置 ↗</text>
<text x="40" y="608" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334155">候选20、精排5、扩充最多10块 / 2560 token。</text>
</a>
<a href="../FINAL_EVALUATION.html#holdout-results" aria-label="固定方案后运行16道保留题：点击查看详情">
<rect x="570" y="552" width="510" height="82" rx="12" fill="white" stroke="#276956" stroke-width="2"/>
<text x="590" y="582" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#276956">固定方案后运行16道保留题 ↗</text>
<text x="590" y="608" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334155">严格通过15/16；每题生成一次，结果后未再调参。</text>
</a>
<a href="../FINAL_EVALUATION.html#conclusion" aria-label="评测完成：结论与使用边界：点击查看详情">
<rect x="20" y="676" width="1060" height="82" rx="12" fill="white" stroke="#203d65" stroke-width="2"/>
<text x="40" y="706" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#203d65">评测完成：结论与使用边界 ↗</text>
<text x="40" y="732" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334155">证据更完整，输入更多；未证明总体准确率提升。</text>
</a>
</svg>
