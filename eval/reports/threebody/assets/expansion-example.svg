<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 444" role="img" aria-labelledby="title-444">
<title id="title-444">开发题16的相邻原文扩充示例</title>
<defs><marker id="arrow-444" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#71849b"/></marker></defs>
<rect width="1100" height="100%" rx="18" fill="#f3f6fa"/>
<path d="M275 102 V142" fill="none" stroke="#71849b" stroke-width="2" marker-end="url(#arrow-444)"/>
<path d="M825 102 V142" fill="none" stroke="#71849b" stroke-width="2" marker-end="url(#arrow-444)"/>
<path d="M275 300 V342" fill="none" stroke="#71849b" stroke-width="2" marker-end="url(#arrow-444)"/>
<path d="M825 300 V342" fill="none" stroke="#71849b" stroke-width="2" marker-end="url(#arrow-444)"/>
<a href="../FINAL_EVALUATION.html#tb-dev-16" aria-label="开发题16：为什么让“审判日”号白天通过？：点击查看详情">
<rect x="20" y="20" width="1060" height="82" rx="12" fill="white" stroke="#203d65" stroke-width="2"/>
<text x="40" y="50" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#203d65">开发题16：为什么让“审判日”号白天通过？ ↗</text>
<text x="40" y="76" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334155">同一道问题、同一混合检索、同样先取20块并精排留5块。</text>
</a>
<a href="../FINAL_EVALUATION.html#example" aria-label="hybrid-n0：不扩充，输入5块：点击查看详情">
<rect x="20" y="142" width="510" height="158" rx="12" fill="white" stroke="#775524" stroke-width="2"/>
<text x="40" y="172" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#775524">hybrid-n0：不扩充，输入5块 ↗</text>
<text x="40" y="198" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334155">已取到块729，原文在半句处截断：</text>
<text x="40" y="223" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334155">“夜里船上的人睡觉啊，都是躺着的，</text>
<text x="40" y="248" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334155">五十厘米的空当……”</text>
<text x="40" y="273" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334155">回答有“站立、走动”等推断。</text>
</a>
<a href="../FINAL_EVALUATION.html#example" aria-label="hybrid-n1：补相邻原文，输入10块：点击查看详情">
<rect x="570" y="142" width="510" height="158" rx="12" fill="white" stroke="#276956" stroke-width="2"/>
<text x="590" y="172" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#276956">hybrid-n1：补相邻原文，输入10块 ↗</text>
<text x="590" y="198" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334155">新增块730，接上原文：</text>
<text x="590" y="223" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334155">“五十厘米的空当太大了，白天他们</text>
<text x="590" y="248" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334155">就是坐着或蹲着，也够了。”</text>
<text x="590" y="273" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334155">回答可以直接依据完整解释。</text>
</a>
<a href="../FINAL_EVALUATION.html#term-expansion" aria-label="这里的“扩充”是补原书相邻段落；“语义评分”是回答之后的评分：点击查看详情">
<rect x="20" y="342" width="1060" height="82" rx="12" fill="white" stroke="#203d65" stroke-width="2"/>
<text x="40" y="372" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#203d65">这里的“扩充”是补原书相邻段落；“语义评分”是回答之后的评分 ↗</text>
<text x="40" y="398" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334155">两组本题自动评分都满分，因此还需要核对具体原文，不能只看通过率。</text>
</a>
</svg>
