description: Three-Body volume-one development pilot, eight source-checked cases
prompts:
  - '{{case_id}}'
providers:
  - id: http
    config:
      url: http://127.0.0.1:8002/evaluate
      method: POST
      headers:
        Content-Type: application/json
      body:
        case_id: '{{prompt}}'
      transformResponse: json
      timeout: 300000
tests:
  - vars: {case_id: tb-dev-01}
  - vars: {case_id: tb-dev-02}
  - vars: {case_id: tb-dev-03}
  - vars: {case_id: tb-dev-04}
  - vars: {case_id: tb-dev-05}
  - vars: {case_id: tb-dev-06}
  - vars: {case_id: tb-dev-07}
  - vars: {case_id: tb-dev-08}
defaultTest:
  assert:
    - type: javascript
      value: file://pilot_checks.cjs
